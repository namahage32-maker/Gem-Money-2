        function runExport(rangeType, overrideFormat = null) {
            const fmt = overrideFormat || exportFormat;
            const chkEl = document.getElementById('chk-export-household-only');
            const onlyHousehold = chkEl ? chkEl.checked : exportHouseholdOnly;

            const now = new Date();
            const sourceList = (fmt === 'json') ? db : getActiveDb();
            // JSON出力時は、期間外の過去明細であっても直近90日以内に編集・削除されたものは同期漏れ防止のため含める
            const recentSyncCutoffTs = Date.now() - (90 * 24 * 60 * 60 * 1000);
            const isRecentlyModified = (item) => (fmt === 'json' && item.updatedAt && item.updatedAt >= recentSyncCutoffTs);

            let filteredDb = [];
            let filenameSuffix = "";

            if (rangeType === 'all') {
                filteredDb = [...sourceList];
                filenameSuffix = "all";
            } else if (rangeType === 'year') {
                const thisYear = now.getFullYear().toString();
                filteredDb = sourceList.filter(i => (i.date && i.date.startsWith(thisYear)) || isRecentlyModified(i));
                filenameSuffix = `${thisYear}`;
            } else if (rangeType === '3months') {
                const cutoff = new Date(now.getFullYear(), now.getMonth() - 2, 1);
                const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-01`;
                filteredDb = sourceList.filter(i => (i.date && i.date >= cutoffStr) || isRecentlyModified(i));
                filenameSuffix = "recent_3months";
            } else if (rangeType === 'month') {
                const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                filteredDb = sourceList.filter(i => (i.date && i.date.startsWith(thisMonth)) || isRecentlyModified(i));
                filenameSuffix = thisMonth;
            }

            let blob, filename, mimeType;

            if (fmt === 'json') {
                const payload = {
                    sourceApp: "GemMoney",
                    exportedAt: new Date().toISOString(),
                    range: rangeType,
                    householdOnly: onlyHousehold,
                    cats: cats,
                    catsUpdatedAt: catsUpdatedAt,
                    subs: subs,
                    annualSubs: annualSubs,
                    budgets: budgets,
                    budgetsUpdatedAt: budgetsUpdatedAt,
                    clearedAssetMonths: clearedAssetMonths,
                    db: filteredDb
                };
                // チェックを外した時のみ金融資産データ一式も同梱する
                if (!onlyHousehold) {
                    payload.assetRecords = assetRecords;
                    payload.records = assetRecords;
                    payload.rebTargets = rebTargets;
                    payload.rebTargetsUpdatedAt = rebTargetsUpdatedAt;
                    payload.simParams = simParams;
                    payload.simParamsUpdatedAt = simParamsUpdatedAt;
                }
                mimeType = 'application/json';
                blob = new Blob([JSON.stringify(payload, null, 2)], { type: mimeType });
                filename = `GemMoney_${filenameSuffix}.json`;
            } else {
                let csv = "\uFEFF日付,カテゴリ,項目,金額,メモ\n" + filteredDb.map(r => `${r.date},"${(r.category||'').replace(/"/g,'""')}","${(r.title||'').replace(/"/g,'""')}",${r.amount},"${(r.memo||'').replace(/"/g,'""')}"`).join("\n");
                mimeType = 'text/csv;charset=utf-8;';
                blob = new Blob([csv], { type: mimeType });
                filename = `GemMoney_${filenameSuffix}.csv`;
            }

            document.getElementById('modal').style.display = 'none';

            if (fmt === 'json') {
                lastSyncInfo = {
                    time: Date.now(),
                    action: 'JSON保存',
                    source: rangeType === '3months' ? '3ヶ月' : rangeType
                };
                save();
            }

            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        /* --- JSON取込（直近2年分のみ自動抽出してスマホを常に軽量に保つ） --- */
        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                try {
                    const raw = JSON.parse(ev.target.result);
                    const isAssetArray = Array.isArray(raw) && raw.length > 0 && raw[0].month && Array.isArray(raw[0].assets);
                    const d = isAssetArray ? { sourceApp: "GemAssetManager", records: raw } : raw;
                    const hasDb = Boolean(d && Array.isArray(d.db));
                    const hasAssets = Boolean(d && (Array.isArray(d.assetRecords) || Array.isArray(d.records)));
                    if (hasDb || hasAssets) {
                        d._hasHouseholdDb = hasDb;
                        if (!hasDb) d.db = [];
                        pendingImportData = d;
                        const cutoffStr = getImportCutoffDateStr();
                        const totalActive = d.db.filter(i => !i.deleted).length;
                        const recentActive = d.db.filter(i => !i.deleted && i.date && i.date >= cutoffStr).length;
                        openImportModal(recentActive, totalActive, cutoffStr, hasDb);
                    } else {
                        alert("対応するデータ形式ではありません。");
                    }
                } catch (err) {
                    alert("JSONファイルの読み込みに失敗しました。");
                }
                e.target.value = '';
            };
            r.readAsText(file);
        }

        function openImportModal(recentCount, totalCount, cutoffStr, hasDb = true) {
            const m = document.getElementById('modal');
            const b = document.getElementById('m-body');
            const isPartialRange = Boolean(pendingImportData && pendingImportData.range && pendingImportData.range !== 'all' && pendingImportData.range !== '2years');
            const canOverwrite = hasDb && !isPartialRange;

            document.getElementById('m-title').innerText = hasDb
                ? `JSON読込 (直近2年分: ${recentCount}件)`
                : `資産JSON読込 (家計明細なし)`;
            b.style.gridTemplateColumns = '1fr';
            const omittedCount = Math.max(0, totalCount - recentCount);

            const partialNote = isPartialRange
                ? `<br><span style="color:var(--yellow);">※期間指定（${escapeHtml(pendingImportData.range)}）の部分出力ファイルのため、過去データの消失を防ぐため「統合（マージ）」のみ実行可能です。</span>`
                : '';

            const infoHtml = hasDb
                ? `<div style="font-size:11px; color:#aaa; background:#161616; padding:8px 10px; border-radius:6px; border:1px solid #2a2a2a; line-height:1.4;">
                    ⚡ <b>スマホ軽量化フィルタ適用:</b><br>
                    ${cutoffStr} 以降の明細（<b>${recentCount}件</b>）のみを取り込みます${omittedCount > 0 ? `（それ以前の過去データ ${omittedCount}件 はPC側GemWalletで保管されるためスマホからは除外）` : ''}。${partialNote}
                </div>`
                : `<div style="font-size:11px; color:var(--yellow); background:#161616; padding:8px 10px; border-radius:6px; border:1px solid var(--yellow); line-height:1.4;">
                    💎 <b>金融資産専用ファイル:</b><br>
                    このファイルには家計簿明細が含まれていないため、スマホ内の家計簿を保護するため「統合（マージ）」のみ実行可能です。
                </div>`;

            const overwriteBtnHtml = canOverwrite
                ? `<button class="card" onclick="executeImport('overwrite')" style="padding:14px; text-align:left;">
                    <div style="color:var(--red); font-size:15px; margin-bottom:4px;">⚠️ 完全に上書き（置換）</div>
                    <div style="font-size:11px; color:#aaa; font-weight:normal;">現在のスマホ内のデータをすべて消去し、ファイルの直近2年分に置き換えます</div>
                </button>`
                : '';

            b.innerHTML = `
                ${infoHtml}
                <button class="card" onclick="executeImport('merge')" style="padding:14px; text-align:left; border-color:var(--blue);">
                    <div style="color:var(--blue); font-size:15px; margin-bottom:4px;">🔄 既存データと統合（マージ）</div>
                    <div style="font-size:11px; color:#aaa; font-weight:normal;">${hasDb ? '直近2年分の明細・定期登録設定を判定して最新の状態に統合します（推奨）' : 'スマホ内の家計簿を維持したまま、金融資産データのみを最新状態に統合します'}</div>
                </button>
                ${overwriteBtnHtml}
            `;
            m.style.display = 'flex';
        }

        function executeImport(type) {
            if (!pendingImportData) return;
            const d = pendingImportData;
            pendingImportData = null;
            document.getElementById('modal').style.display = 'none';

            const cutoffStr = getImportCutoffDateStr();
            const incomingRecentDb = d.db.filter(i => {
                if (!i || !i.date || i.date < cutoffStr) return false;
                const amt = Number(i.amount);
                if (!Number.isFinite(amt) || amt <= 0) return false;
                i.amount = amt;
                return true;
            });
            const isPartialRange = Boolean(d.range && d.range !== 'all' && d.range !== '2years');

            if (type === 'overwrite') {
                if (!d._hasHouseholdDb || isPartialRange) {
                    alert("家計簿明細が含まれないファイル、または期間指定の部分出力ファイルのため完全上書きは実行できません。「既存データと統合（マージ）」を選択してください。");
                    return;
                }
                if (!confirm(`本当に現在のデータを消去し、直近2年分（${cutoffStr}以降）のデータで上書きしますか？`)) return;
                db = incomingRecentDb;
                if (d.cats && Array.isArray(d.cats)) {
                    cats = [...new Set([...d.cats, '収入'])];
                    catsUpdatedAt = d.catsUpdatedAt || Date.now();
                }
                if (d.subs && Array.isArray(d.subs)) {
                    subs = d.subs;
                }
                if (d.annualSubs && Array.isArray(d.annualSubs)) {
                    annualSubs = d.annualSubs;
                }
                if (d.budgets && typeof d.budgets === 'object') {
                    budgets = { ...d.budgets };
                    budgetsUpdatedAt = d.budgetsUpdatedAt || Date.now();
                }
                clearedAssetMonths = (d.clearedAssetMonths && typeof d.clearedAssetMonths === 'object')
                    ? { ...d.clearedAssetMonths }
                    : {};
                const incomingAssets = Array.isArray(d.records) && d.records.length > 0
                    ? d.records
                    : (Array.isArray(d.assetRecords) ? d.assetRecords : null);
                // 完全上書き時は既存の古い資産データを残さず、ファイルの資産データでクリーンに置換
                if (incomingAssets) {
                    const assetMap = new Map();
                    incomingAssets.forEach(r => { if (r && r.month) assetMap.set(r.month, r); });
                    assetRecords = Array.from(assetMap.values()).sort((a, b) => a.month.localeCompare(b.month));
                } else if (!d.householdOnly) {
                    assetRecords = [];
                }
                if (d.rebTargets !== undefined) {
                    rebTargets = d.rebTargets || null;
                    rebTargetsUpdatedAt = d.rebTargetsUpdatedAt || (d.rebTargets && d.rebTargets.updatedAt) || 0;
                } else if (!d.householdOnly) {
                    rebTargets = null;
                    rebTargetsUpdatedAt = 0;
                }
                if (d.simParams !== undefined) {
                    simParams = d.simParams || null;
                    simParamsUpdatedAt = d.simParamsUpdatedAt || (d.simParams && d.simParams.updatedAt) || 0;
                } else if (!d.householdOnly) {
                    simParams = null;
                    simParamsUpdatedAt = 0;
                }
                lastSyncInfo = {
                    time: Date.now(),
                    action: '取込(上書き)',
                    source: d.sourceApp || 'JSON'
                };
                processSubscriptions();
                db = db.filter(i => i.date && i.date >= cutoffStr);
                sortDbDesc();
                save();
                renderCats();
                render();
                if (mode === 'stats') drawStats();
                alert(`直近2年分（${getActiveDb().length}件）のデータを上書きしました。`);
            } else {
                db = db.filter(i => i && i.date && i.date >= cutoffStr);
                const existingMap = new Map(db.map(i => [i.id, i]));
                let added = 0, updated = 0, deletedSync = 0;

                incomingRecentDb.forEach(item => {
                    if (existingMap.has(item.id)) {
                        const existing = existingMap.get(item.id);
                        const inTime = item.updatedAt || 0;
                        const exTime = existing.updatedAt || 0;

                        if (item.deleted && !existing.deleted) {
                            if (inTime >= exTime || exTime === 0) {
                                existing.deleted = true;
                                if (item.pendingSubDay) existing.pendingSubDay = true;
                                else delete existing.pendingSubDay;
                                existing.updatedAt = Math.max(inTime, exTime, Date.now());
                                deletedSync++;
                            }
                        } else if (!item.deleted && existing.deleted) {
                            if (inTime > exTime) {
                                delete existing.memo;
                                delete existing.manuallyEdited;
                                delete existing.annualSubId;
                                Object.assign(existing, item);
                                delete existing.deleted;
                                delete existing.pendingSubDay;
                                updated++;
                            }
                        } else if (!item.deleted && !existing.deleted) {
                            if (inTime >= exTime) {
                                delete existing.memo;
                                delete existing.manuallyEdited;
                                delete existing.annualSubId;
                                delete existing.pendingSubDay;
                                Object.assign(existing, item);
                                updated++;
                            }
                        } else if (item.deleted && existing.deleted) {
                            if (inTime >= exTime) {
                                if (item.pendingSubDay) existing.pendingSubDay = true;
                                else delete existing.pendingSubDay;
                                existing.updatedAt = Math.max(inTime, exTime);
                            }
                        }
                    } else {
                        db.push(item);
                        existingMap.set(item.id, item);
                        if (!item.deleted) added++;
                    }
                });

                if (d.subs && Array.isArray(d.subs)) {
                    const subMap = new Map(subs.map(s => [s.id, s]));
                    d.subs.forEach(inSub => {
                        if (subMap.has(inSub.id)) {
                            const exSub = subMap.get(inSub.id);
                            if ((inSub.updatedAt || 0) >= (exSub.updatedAt || 0)) {
                                const preservedResumeMonth = exSub.resumeMonth;
                                delete exSub.endMonth;
                                delete exSub.memo;
                                delete exSub.deleted;
                                delete exSub.manualPause;
                                delete exSub.resumeMonth;
                                Object.assign(exSub, inSub);
                                if (!exSub.resumeMonth && preservedResumeMonth && (!exSub.startMonth || preservedResumeMonth > exSub.startMonth)) {
                                    exSub.resumeMonth = preservedResumeMonth;
                                }
                            }
                        } else {
                            subs.push(inSub);
                            subMap.set(inSub.id, inSub);
                        }
                    });
                }

                if (d.annualSubs && Array.isArray(d.annualSubs)) {
                    const annMap = new Map(annualSubs.map(a => [a.id, a]));
                    d.annualSubs.forEach(inAnn => {
                        if (!inAnn || !inAnn.id) return;
                        if (annMap.has(inAnn.id)) {
                            const exAnn = annMap.get(inAnn.id);
                            if ((inAnn.updatedAt || 0) >= (exAnn.updatedAt || 0)) {
                                delete exAnn.memo;
                                delete exAnn.deleted;
                                Object.assign(exAnn, inAnn);
                            }
                        } else {
                            annualSubs.push(inAnn);
                            annMap.set(inAnn.id, inAnn);
                        }
                    });
                }

                // カテゴリのタイムスタンプ比較（削除・並び替えの反映）
                if (d.cats && Array.isArray(d.cats)) {
                    const inCTime = d.catsUpdatedAt || 0;
                    if (inCTime > 0 || catsUpdatedAt > 0) {
                        if (inCTime >= catsUpdatedAt) {
                            cats = [...new Set([...d.cats, '収入'])];
                            catsUpdatedAt = inCTime;
                        } else {
                            cats = [...new Set([...cats, '収入'])];
                        }
                    } else {
                        // 双方ともカテゴリ編集履歴がない初期状態の場合のみ合算
                        cats = [...new Set([...cats, ...d.cats, '収入'])];
                    }
                }
                if (d.budgets && typeof d.budgets === 'object') {
                    const inBTime = d.budgetsUpdatedAt || 0;
                    if (inBTime > 0 || budgetsUpdatedAt > 0) {
                        if (inBTime >= budgetsUpdatedAt) {
                            budgets = { ...d.budgets };
                            budgetsUpdatedAt = inBTime;
                        }
                    } else {
                        budgets = { ...budgets, ...d.budgets };
                    }
                }
                if (d.clearedAssetMonths && typeof d.clearedAssetMonths === 'object') {
                    Object.entries(d.clearedAssetMonths).forEach(([m, ts]) => {
                        if (!clearedAssetMonths[m] || ts > clearedAssetMonths[m]) {
                            clearedAssetMonths[m] = ts;
                        }
                    });
                }
                // 既存の資産から、削除履歴(clearedAssetMonths)より古いものを先にパージ
                assetRecords = assetRecords.filter(rec => {
                    if (!rec || !rec.month) return false;
                    const cTs = clearedAssetMonths[rec.month] || 0;
                    return !(cTs > 0 && (rec.updatedAt || 0) <= cTs);
                });

                const incomingAssets = Array.isArray(d.records) && d.records.length > 0
                    ? d.records
                    : (Array.isArray(d.assetRecords) ? d.assetRecords : null);
                if (incomingAssets) {
                    // 既存の資産データを消さずに月単位でマージ
                    const assetMap = new Map(assetRecords.map(r => [r.month, r]));
                    const fileTs = d.exportedAt ? new Date(d.exportedAt).getTime() : 0;
                    incomingAssets.forEach(r => {
                        if (!r || !r.month) return;
                        const inTime = r.updatedAt || fileTs || 0;
                        const clearedTs = clearedAssetMonths[r.month] || 0;
                        if (clearedTs > 0 && inTime <= clearedTs) return;

                        const ex = assetMap.get(r.month);
                        const exTime = ex ? (ex.updatedAt || 0) : 0;
                        if (!ex || inTime >= exTime) {
                            assetMap.set(r.month, { ...r, updatedAt: inTime || Date.now() });
                            delete clearedAssetMonths[r.month];
                        }
                    });
                    assetRecords = Array.from(assetMap.values()).sort((a, b) => a.month.localeCompare(b.month));
                }
                if (d.rebTargets) {
                    const inRTime = d.rebTargetsUpdatedAt || d.rebTargets.updatedAt || 0;
                    if (!rebTargets || inRTime >= rebTargetsUpdatedAt) {
                        rebTargets = d.rebTargets;
                        rebTargetsUpdatedAt = inRTime;
                    }
                }
                if (d.simParams) {
                    const inSTime = d.simParamsUpdatedAt || d.simParams.updatedAt || 0;
                    if (!simParams || inSTime >= simParamsUpdatedAt) {
                        simParams = d.simParams;
                        simParamsUpdatedAt = inSTime;
                    }
                }
                lastSyncInfo = {
                    time: Date.now(),
                    action: '取込(統合)',
                    source: d.sourceApp || 'JSON'
                };

                const subAdded = processSubscriptions();
                db = db.filter(i => i.date && i.date >= cutoffStr);
                sortDbDesc();
                save();
                renderCats();
                render();
                if (mode === 'stats') drawStats();
                alert(`統合完了（直近2年分）：新規 ${added + subAdded}件 追加 / ${updated}件 更新 / ${deletedSync}件 削除反映`);
            }
        }

        function manageCats() {
            const n = prompt("カテゴリ(,区切り)", cats.join(","));
            if(n) {
                cats = [...new Set(n.split(/[,、，]/).map(s=>s.trim()).filter(s=>s))];
                if (!cats.includes("収入")) cats.push("収入");
                catsUpdatedAt = Date.now();
                save(); renderCats(); render();
                if (mode === 'stats') drawStats();
            }
        }
        init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker登録成功:', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker登録失敗:', err);
                });
            });
        }
    </script>
</body>
</html>
