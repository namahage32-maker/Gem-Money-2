<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GemMoney2 v3</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #e5e5e5;
            --blue: #4dabf7; --red: #ff6b6b; --yellow: #fcc419; --gray: #444;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 85px; overflow-x: hidden; }
        .flex { display: flex; } .justify-between { justify-content: space-between; } .items-center { align-items: center; }
        .gap-1 { gap: 4px; } .gap-2 { gap: 8px; }
        .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
        .grid { display: grid; gap: 8px; } .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .card { background: var(--card); border-radius: 12px; border: 1px solid #333; padding: 12px; position: relative; }
        h2 { color: var(--blue); font-style: italic; margin: 0; letter-spacing: -1px; }
        input, select, button { background: #2a2a2a; color: white; border: 1px solid var(--gray); border-radius: 6px; padding: 8px; font-size: 14px; box-sizing: border-box; }
        button { cursor: pointer; border: none; font-weight: bold; touch-action: manipulation; }
        .btn-blue { background: var(--blue); color: white; } 
        .btn-gray { background: #333; color: #aaa; }
        .income { color: var(--blue); } .expense { color: var(--red); }
        .tab-btn { background: none; border: none; color: #777; font-size: 12px; padding: 5px 10px; }
        .tab-active { color: var(--blue); border-bottom: 2px solid var(--blue); }
        
        .chart-container { height: 200px; width: calc(100% - 35px); position: relative; margin-top: 20px; margin-left: 35px; border-left: 1px solid #444; border-bottom: 1px solid #444; }
        svg { width: 100%; height: 100%; overflow: visible; }
        .grid-line { stroke: #333; stroke-width: 1; }
        .axis-label { fill: #666; font-size: 9px; }
        .bar-income { fill: var(--blue); opacity: 0.8; }
        
        .history-item { border-bottom: 1px solid #222; padding: 10px 0; font-size: 14px; }
        .memo-text { font-size: 11px; color: #888; margin-top: 3px; }
        footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid #333; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; z-index: 50; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .numpad button { background: #2a2a2a; font-size: 20px; padding: 12px; border-radius: 8px; border: 1px solid #333; }
        .numpad button:active { background: #444; }
        .amt-display { flex: 1; text-align: right; font-size: 20px; font-weight: bold; background: #111; color: var(--blue); border: 1px solid #444; outline: none; }

        .suggest-list {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #2a2a2a; border: 1px solid var(--gray); border-top: none;
            border-radius: 0 0 6px 6px; z-index: 20; max-height: 150px; overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8); display: none;
        }
        .suggest-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; color: var(--text); font-size: 14px; }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-item:active { background: #444; }
        .suggest-cat { font-size: 11px; color: var(--blue); margin-left: 8px; border: 1px solid var(--blue); padding: 2px 4px; border-radius: 4px; }
        
        .memo-btn-active { border: 1px solid var(--blue) !important; color: var(--blue) !important; }
        .export-row { display: flex; flex-direction: column; gap: 6px; background: #161616; padding: 10px; border-radius: 8px; border: 1px solid #2a2a2a; }
    </style>
</head>
<body>

    <div class="flex justify-between items-center mb-4">
        <h2>GemMoney2 v3</h2>
        <div class="flex">
            <button onclick="setView('day')" id="t-day" class="tab-btn">一日</button>
            <button onclick="setView('month')" id="t-month" class="tab-btn tab-active">月別</button>
            <button onclick="setView('stats')" id="t-stats" class="tab-btn">統計</button>
        </div>
    </div>

    <div id="view-main">
        <div class="flex justify-between items-center card mb-4">
            <button onclick="move(-1)" style="color:var(--blue); padding:5px 15px;">◀</button>
            <div onclick="openJump()" id="label-period" style="font-weight:bold; font-size:16px; cursor:pointer;">2026年 3月</div>
            <button onclick="move(1)" style="color:var(--blue); padding:5px 15px;">▶</button>
        </div>
        
        <div class="grid grid-3 mb-4">
            <div class="card" style="text-align:center"><small>IN</small><div id="sum-in" class="income">0</div></div>
            <div class="card" style="text-align:center"><small>OUT</small><div id="sum-out" class="expense">0</div></div>
            <div class="card" style="text-align:center"><small>BAL</small><div id="sum-bal">0</div></div>
        </div>

        <div class="card mb-4">
            <div class="flex gap-2 mb-2">
                <input type="date" id="in-date" style="flex:1" onchange="syncFromInput()">
                <select id="in-cat" style="flex:1"></select>
            </div>
            
            <div class="flex gap-2 mb-2">
                <div style="position:relative; flex:1;">
                    <input type="text" id="in-title" placeholder="項目名(任意)" style="width:100%" autocomplete="off" oninput="handleSuggest(this.value)" onblur="setTimeout(()=>closeSuggest(), 200)">
                    <div id="suggest-box" class="suggest-list"></div>
                </div>
                <button type="button" id="btn-memo-toggle" onclick="toggleMemo()" class="btn-gray" style="padding:0 12px; font-size:16px;" title="メモを入力">💬</button>
            </div>

            <div id="memo-wrap" class="mb-2" style="display:none;">
                <input type="text" id="in-memo" placeholder="メモ・注釈(任意)" style="width:100%; font-size:13px; background:#181818;" autocomplete="off" oninput="updateMemoBtnState()">
            </div>

            <div class="flex gap-2 items-center">
                <div style="font-weight:bold; color:#777; font-size:18px;">¥</div>
                <input type="text" id="in-amt" class="amt-display" placeholder="0" readonly inputmode="none" data-val="">
                <button id="btn-cancel" onclick="cancelEdit()" class="btn-gray" style="display:none; padding:12px 15px; font-size:16px;">✕</button>
                <button id="btn-add" onclick="add()" class="btn-blue" style="width:80px; font-size:16px; padding:12px;">ADD</button>
            </div>
            
            <div class="numpad">
                <button onclick="num(7)">7</button>
                <button onclick="num(8)">8</button>
                <button onclick="num(9)">9</button>
                <button onclick="num(4)">4</button>
                <button onclick="num(5)">5</button>
                <button onclick="num(6)">6</button>
                <button onclick="num(1)">1</button>
                <button onclick="num(2)">2</button>
                <button onclick="num(3)">3</button>
                <button onclick="num('C')" style="color:var(--red)">C</button>
                <button onclick="num(0)">0</button>
                <button onclick="num('BS')" style="color:var(--yellow)">⌫</button>
            </div>
        </div>
        
        <div id="list"></div>
    </div>

    <div id="view-stats" style="display:none">
        <div class="flex gap-2 mb-4">
            <select id="stat-unit" onchange="drawStats()" style="flex:1">
                <option value="month">月単位（直近12回）</option>
                <option value="year">年単位（全期間）</option>
            </select>
            <button onclick="drawStats()" class="btn-gray">更新</button>
        </div>
        <div class="card mb-4">
            <div style="font-size:12px; font-weight:bold">収支時系列（積立推移）</div>
            <div id="chart-ts" class="chart-container"></div>
            <div id="chart-legend"></div>
        </div>
        <div class="card">
            <div class="flex justify-between items-center mb-2">
                <div style="font-size:12px; font-weight:bold">カテゴリ別推移</div>
                <select id="stat-cat" onchange="drawStats()" style="font-size:10px; padding:2px"></select>
            </div>
            <div id="chart-cat" class="chart-container"></div>
        </div>
    </div>

    <footer>
        <div class="flex gap-1 items-center">
            <button onclick="quickShareAll()" class="btn-blue" style="padding:8px 10px; font-size:12px;">📤 共有</button>
            <button onclick="openExportModal('json')" class="btn-gray" style="padding:8px 10px; font-size:12px;">JSON</button>
            <button onclick="openExportModal('csv')" class="btn-gray" style="padding:8px 10px; font-size:12px;">CSV</button>
            <label class="btn-gray" style="padding:8px 10px; font-size:12px; border-radius:6px; font-weight:bold; cursor:pointer;">取込<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label>
        </div>
        <button onclick="manageCats()" style="color:#777; font-size:11px; padding:6px;">カテゴリ編集</button>
    </footer>

    <div id="modal" onclick="this.style.display='none'">
        <div class="card" style="width:88%; max-width:360px; max-height:80%; overflow:auto" onclick="event.stopPropagation()">
            <div id="m-title" style="text-align:center; padding:10px; border-bottom:1px solid #333; font-weight:bold"></div>
            <div id="m-body" class="grid grid-3" style="padding:15px"></div>
        </div>
    </div>

    <script>
        const DEFAULT_CATS = ["食費", "車", "生活雑費", "育児", "税金", "ふるさと納税", "緊急支出", "保険", "遊興費", "業務費", "投資", "負債", "収入"];
        let db = JSON.parse(localStorage.getItem('gem_db')) || [];
        let cats = JSON.parse(localStorage.getItem('gem_cats')) || DEFAULT_CATS;
        let mode = 'month', focus = new Date();
        let currentAmt = "";
        let editId = null; 
        let pendingImportData = null;

        // 論理削除されていない有効なデータのみを取得するヘルパー
        function getActiveDb() {
            return db.filter(i => !i.deleted);
        }

        function save() {
            localStorage.setItem('gem_db', JSON.stringify(db));
            localStorage.setItem('gem_cats', JSON.stringify(cats));
        }

        function init() {
            document.getElementById('in-date').valueAsDate = new Date();
            renderCats();
            render();
        }

        function renderCats() {
            const h = cats.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('in-cat').innerHTML = h;
            document.getElementById('stat-cat').innerHTML = cats.filter(c=>c!=='収入').map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function setView(m) {
            mode = m;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('t-'+m).classList.add('tab-active');
            document.getElementById('view-main').style.display = (m==='stats'?'none':'block');
            document.getElementById('view-stats').style.display = (m==='stats'?'block':'none');
            if(m === 'stats') drawStats(); else render();
        }

        function move(d) {
            if(mode==='day') focus.setDate(focus.getDate()+d);
            else focus.setMonth(focus.getMonth()+d);
            render();
        }

        function syncFromInput() {
            const d = document.getElementById('in-date').value;
            if(d) {
                const parts = d.split('-');
                focus = new Date(parts[0], parts[1] - 1, parts[2]);
                if(mode !== 'day') setView('day'); else render();
            }
        }

        function toggleMemo() {
            const wrap = document.getElementById('memo-wrap');
            if (wrap.style.display === 'none') {
                wrap.style.display = 'block';
                document.getElementById('in-memo').focus();
            } else {
                wrap.style.display = 'none';
            }
            updateMemoBtnState();
        }

        function updateMemoBtnState() {
            const val = document.getElementById('in-memo').value.trim();
            const wrap = document.getElementById('memo-wrap');
            const btn = document.getElementById('btn-memo-toggle');
            if (val || wrap.style.display === 'block') {
                btn.classList.add('memo-btn-active');
            } else {
                btn.classList.remove('memo-btn-active');
            }
        }

        function handleSuggest(val) {
            const box = document.getElementById('suggest-box');
            if (!val) { box.style.display = 'none'; return; }
            const matches = [];
            const seen = new Set();
            const activeList = getActiveDb();
            for (let i = 0; i < activeList.length; i++) {
                const item = activeList[i];
                if (item.title && item.title.includes(val) && !seen.has(item.title)) {
                    seen.add(item.title);
                    matches.push({ title: item.title, category: item.category });
                }
                if (matches.length >= 5) break;
            }
            if (matches.length > 0) {
                box.innerHTML = matches.map(m => 
                    `<div class="suggest-item" onclick="selectSuggest('${m.title.replace(/'/g, "\\'")}', '${m.category.replace(/'/g, "\\'")}')">
                        ${m.title} <span class="suggest-cat">${m.category}</span>
                    </div>`
                ).join('');
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        function selectSuggest(title, cat) {
            document.getElementById('in-title').value = title;
            if (cats.includes(cat)) document.getElementById('in-cat').value = cat;
            closeSuggest();
        }

        function closeSuggest() { document.getElementById('suggest-box').style.display = 'none'; }

        function num(n) {
            if (n === 'C') currentAmt = "";
            else if (n === 'BS') currentAmt = currentAmt.slice(0, -1);
            else if (currentAmt.length < 8) currentAmt += n;
            const amtDisplay = document.getElementById('in-amt');
            amtDisplay.dataset.val = currentAmt;
            amtDisplay.value = currentAmt ? parseInt(currentAmt).toLocaleString() : "";
        }

        function edit(id) {
            const item = db.find(i => i.id === id && !i.deleted);
            if (!item) return;
            
            editId = id; 
            document.getElementById('in-date').value = item.date;
            if (!cats.includes(item.category)) {
                cats.push(item.category);
                renderCats();
            }
            document.getElementById('in-cat').value = item.category;
            document.getElementById('in-title').value = item.title;
            
            const memoInput = document.getElementById('in-memo');
            const memoWrap = document.getElementById('memo-wrap');
            memoInput.value = item.memo || '';
            memoWrap.style.display = item.memo ? 'block' : 'none';
            updateMemoBtnState();

            currentAmt = item.amount.toString();
            const amtDisplay = document.getElementById('in-amt');
            amtDisplay.dataset.val = currentAmt;
            amtDisplay.value = parseInt(currentAmt).toLocaleString();

            const btnAdd = document.getElementById('btn-add');
            btnAdd.innerText = "更新";
            btnAdd.style.background = "var(--yellow)";
            btnAdd.style.color = "#111";

            document.getElementById('btn-cancel').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editId = null; 
            document.getElementById('in-title').value = ''; 
            document.getElementById('in-memo').value = '';
            document.getElementById('memo-wrap').style.display = 'none';
            updateMemoBtnState();

            currentAmt = ""; 
            document.getElementById('in-amt').value = ''; 
            document.getElementById('in-amt').dataset.val = '';
            
            const btnAdd = document.getElementById('btn-add');
            btnAdd.innerText = "ADD";
            btnAdd.style.background = "var(--blue)";
            btnAdd.style.color = "white";

            document.getElementById('btn-cancel').style.display = 'none';
            
            if (mode === 'day') {
                const y = focus.getFullYear(), m = String(focus.getMonth() + 1).padStart(2, '0'), d = String(focus.getDate()).padStart(2, '0');
                document.getElementById('in-date').value = `${y}-${m}-${d}`;
            } else {
                document.getElementById('in-date').valueAsDate = new Date();
            }
        }

        function add() {
            const d = document.getElementById('in-date').value;
            const t = document.getElementById('in-title').value.trim() || '未分類';
            const m = document.getElementById('in-memo').value.trim();
            const a = parseInt(document.getElementById('in-amt').dataset.val) || 0;
            const c = document.getElementById('in-cat').value;
            
            if(!a || !d) return;
            
            if (editId) {
                const index = db.findIndex(i => i.id === editId);
                if (index !== -1) {
                    const updated = { ...db[index], date: d, title: t, amount: a, category: c, updatedAt: Date.now() };
                    delete updated.deleted;
                    if (m) updated.memo = m; else delete updated.memo;
                    db[index] = updated;
                }
            } else {
                const newItem = { id: Date.now(), date: d, title: t, amount: a, category: c, updatedAt: Date.now() };
                if (m) newItem.memo = m;
                db.push(newItem);
            }
            
            db.sort((a,b) => new Date(b.date) - new Date(a.date));
            save(); render();
            cancelEdit(); 
            closeSuggest();
        }

        function render() {
            const label = document.getElementById('label-period');
            label.innerText = mode === 'day' ? focus.toLocaleDateString('ja-JP') : `${focus.getFullYear()}年 ${focus.getMonth()+1}月`;
            if (mode === 'day' && !editId) { 
                const y = focus.getFullYear(), m = String(focus.getMonth() + 1).padStart(2, '0'), d = String(focus.getDate()).padStart(2, '0');
                document.getElementById('in-date').value = `${y}-${m}-${d}`;
            }
            let si=0, so=0, h='', last='';
            const filtered = getActiveDb().filter(i => {
                const parts = i.date.split('-');
                const iy = parseInt(parts[0], 10), im = parseInt(parts[1], 10) - 1, id = parseInt(parts[2], 10);
                if(mode==='day') return iy === focus.getFullYear() && im === focus.getMonth() && id === focus.getDate();
                return iy === focus.getFullYear() && im === focus.getMonth();
            });
            filtered.forEach(i => {
                i.category === '収入' ? si+=i.amount : so+=i.amount;
                if(mode==='month' && last !== i.date) { h += `<div style="font-size:10px; color:#555; margin-top:10px; border-bottom:1px solid #222">${i.date}</div>`; last = i.date; }
                
                h += `
                <div class="history-item flex justify-between items-center">
                    <div style="flex:1; padding-right:8px;">
                        <small style="color:#666">${i.category}</small>
                        <div>${i.title}</div>
                        ${i.memo ? `<div class="memo-text">💬 ${i.memo}</div>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <b class="${i.category==='収入'?'income':'expense'}">¥${i.amount.toLocaleString()}</b>
                        <div class="flex">
                            <button onclick="edit(${i.id})" style="background:none; color:var(--blue); font-size:16px; padding:5px 10px;">✎</button>
                            <button onclick="del(${i.id})" style="background:none; color:#555; font-size:16px; padding:5px;">✕</button>
                        </div>
                    </div>
                </div>`;
            });
            document.getElementById('list').innerHTML = h || '<div style="text-align:center; padding:40px; color:#444">NO DATA</div>';
            document.getElementById('sum-in').innerText = si.toLocaleString();
            document.getElementById('sum-out').innerText = so.toLocaleString();
            document.getElementById('sum-bal').innerText = (si-so).toLocaleString();
        }

        // ① 論理削除（deletedフラグを立てて同期可能にする）
        function del(id) {
            if(confirm('削除しますか？')) {
                const idx = db.findIndex(i => i.id === id);
                if (idx !== -1) {
                    db[idx].deleted = true;
                    db[idx].updatedAt = Date.now();
                    if (editId === id) cancelEdit();
                    save();
                    render();
                }
            }
        }

        function drawStats() {
            const activeList = getActiveDb();
            const unit = document.getElementById('stat-unit').value;
            const periods = [];
            const now = new Date();
            if(unit === 'month') {
                for(let i=11; i>=0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
                    periods.push(`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`);
                }
            } else {
                const years = [...new Set(activeList.map(i => i.date.substring(0,4)))].sort();
                if (years.length === 0) years.push(now.getFullYear().toString());
                years.forEach(y => periods.push(y));
            }

            const colorPalette = ['#ff6b6b', '#fcc419', '#51cf66', '#845ef7', '#f06595', '#20c997', '#ff922b', '#fa5252', '#fd7e14', '#40c057', '#be4bdb'];
            const expCats = cats.filter(c => c !== '収入');
            const catColors = {};
            expCats.forEach((c, i) => { catColors[c] = colorPalette[i % colorPalette.length]; });

            const data = periods.map(p => {
                const items = activeList.filter(i => i.date.startsWith(p));
                let income = 0, expense = 0;
                const expensesByCat = {};
                items.forEach(i => {
                    if(i.category === '収入') {
                        income += i.amount;
                    } else {
                        expense += i.amount;
                        expensesByCat[i.category] = (expensesByCat[i.category] || 0) + i.amount;
                    }
                });
                return { label: unit==='month' ? p.split('-')[1]+'月' : p+'年', income, expense, expensesByCat };
            });

            const maxRaw = Math.max(...data.map(d => Math.max(d.income, d.expense)), 10000);
            const power = Math.pow(10, Math.floor(Math.log10(maxRaw)));
            const maxVal = Math.ceil(maxRaw / power) * power;

            const tsCont = document.getElementById('chart-ts');
            let tsSvg = `<svg viewBox="0 0 320 160">`;
            for(let i=0; i<=4; i++) {
                const y = 140 - (i * 30);
                const val = (maxVal / 4) * i;
                tsSvg += `<line x1="0" y1="${y}" x2="320" y2="${y}" class="grid-line" />`;
                tsSvg += `<text x="-35" y="${y+3}" class="axis-label">${val>=10000?(val/10000)+'万':val}</text>`;
            }
            const step = 320 / (data.length || 1);
            data.forEach((d, i) => {
                const x = i * step + 5;
                const hIn = (d.income / maxVal) * 120;
                tsSvg += `<rect x="${x}" y="${140-hIn}" width="${step*0.35}" height="${hIn}" class="bar-income" />`;
                
                let currentY = 140;
                expCats.forEach(cat => {
                    if(d.expensesByCat[cat]) {
                        const hOut = (d.expensesByCat[cat] / maxVal) * 120;
                        currentY -= hOut;
                        tsSvg += `<rect x="${x+step*0.4}" y="${currentY}" width="${step*0.35}" height="${hOut}" fill="${catColors[cat] || '#888'}" stroke="var(--card)" stroke-width="0.8" opacity="0.95" />`;
                    }
                });
                tsSvg += `<text x="${x}" y="155" class="axis-label" style="font-size:7px">${d.label}</text>`;
            });
            tsSvg += `</svg>`;
            tsCont.innerHTML = tsSvg;

            const legendCont = document.getElementById('chart-legend');
            let legendHtml = `<div class="flex" style="flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px;">`;
            expCats.forEach(cat => {
                legendHtml += `<div class="flex items-center gap-1" style="font-size:10px; color:#bbb;"><div style="width:10px; height:10px; background:${catColors[cat]}; border-radius:2px;"></div>${cat}</div>`;
            });
            legendHtml += `</div>`;
            if(legendCont) legendCont.innerHTML = legendHtml;

            const catCont = document.getElementById('chart-cat');
            const targetCat = document.getElementById('stat-cat').value;
            const targetColor = targetCat === '収入' ? 'var(--blue)' : (catColors[targetCat] || 'var(--blue)');
            const catData = periods.map(p => activeList.filter(i => i.date.startsWith(p) && i.category === targetCat).reduce((s,i)=>s+i.amount,0));
            const catMaxRaw = Math.max(...catData, 5000);
            const catPower = Math.pow(10, Math.floor(Math.log10(catMaxRaw)));
            const catMax = Math.ceil(catMaxRaw / catPower) * catPower;

            let catSvg = `<svg viewBox="0 0 320 160">`;
            for(let i=0; i<=4; i++) {
                const y = 140 - (i * 30);
                catSvg += `<line x1="0" y1="${y}" x2="320" y2="${y}" class="grid-line" />`;
                catSvg += `<text x="-35" y="${y+3}" class="axis-label">${((catMax/4)*i/10000)}万</text>`;
            }
            let points = "";
            catData.forEach((val, i) => {
                const x = i * step + (step/2);
                const y = 140 - (val / catMax) * 120;
                points += `${x},${y} `;
                catSvg += `<circle cx="${x}" cy="${y}" r="3" fill="${targetColor}" />`;
            });
            catSvg += `<polyline points="${points}" fill="none" stroke="${targetColor}" stroke-width="2" />`;
            periods.forEach((p, i) => {
                const label = unit==='month' ? p.split('-')[1]+'月' : p+'年';
                catSvg += `<text x="${i*step+2}" y="155" class="axis-label" style="font-size:7px">${label}</text>`;
            });
            catSvg += `</svg>`;
            catCont.innerHTML = catSvg;
        }

        function openJump() {
            const m = document.getElementById('modal'), b = document.getElementById('m-body');
            document.getElementById('m-title').innerText = "年を選択";
            b.style.gridTemplateColumns = 'repeat(3, 1fr)';

            const currentYear = new Date().getFullYear();
            const dbYears = getActiveDb().map(i => parseInt(i.date.substring(0, 4), 10)).filter(y => !isNaN(y));
            const minYear = Math.min(...dbYears, currentYear - 2, focus.getFullYear());
            const maxYear = Math.max(...dbYears, currentYear + 1, focus.getFullYear());

            const years = [];
            for (let y = minYear; y <= maxYear; y++) {
                years.push(y);
            }

            b.innerHTML = years.map(y => {
                const isActive = y === focus.getFullYear();
                const style = isActive ? 'border-color:var(--blue); color:var(--blue); font-weight:bold; text-align:center; padding:12px 6px;' : 'text-align:center; padding:12px 6px;';
                return `<div class="card" style="${style}" onclick="jumpToYear(${y})">${y}年</div>`;
            }).join('');
            m.style.display = 'flex';
        }
        function jumpToYear(y) { focus.setFullYear(y); render(); document.getElementById('modal').style.display='none'; }

        /* --- ② ワンタップ共有 & エクスポート --- */
        let exportFormat = 'json';

        // フッターの「📤 共有」ボタンから全期間JSONをワンタップ共有
        function quickShareAll() {
            runExport('all', 'share', 'json');
        }

        function openExportModal(format) {
            exportFormat = format;
            const m = document.getElementById('modal');
            const b = document.getElementById('m-body');
            document.getElementById('m-title').innerText = `${format.toUpperCase()} 出力・共有`;
    
            b.style.gridTemplateColumns = '1fr';
            const ranges = [
                { key: 'all', label: '全期間（推奨）' },
                { key: 'year', label: '今年のみ' },
                { key: '3months', label: '直近3ヶ月' },
                { key: 'month', label: '今月のみ' }
            ];

            b.innerHTML = ranges.map(r => `
                <div class="export-row">
                    <div style="font-size:13px; font-weight:bold; color:var(--text);">${r.label}</div>
                    <div class="flex gap-2">
                        <button class="btn-blue" onclick="runExport('${r.key}', 'share')" style="flex:1; padding:10px;">📤 ワンタップ共有</button>
                        <button class="btn-gray" onclick="runExport('${r.key}', 'download')" style="flex:1; padding:10px; color:#fff;">💾 ファイル保存</button>
                    </div>
                </div>
            `).join('');
            m.style.display = 'flex';
        }

        async function runExport(rangeType, action = 'download', overrideFormat = null) {
            const fmt = overrideFormat || exportFormat;
            const now = new Date();
            // JSON出力時は論理削除(deleted:true)も含めて出力し、PC側と削除同期できるようにする
            // CSV出力時は有効なデータのみ出力する
            const sourceList = (fmt === 'json') ? db : getActiveDb();
            let filteredDb = [];
            let filenameSuffix = "";

            if (rangeType === 'all') {
                filteredDb = [...sourceList];
                filenameSuffix = "all";
            } else if (rangeType === 'year') {
                const thisYear = now.getFullYear().toString();
                filteredDb = sourceList.filter(i => i.date && i.date.startsWith(thisYear));
                filenameSuffix = `${thisYear}`;
            } else if (rangeType === '3months') {
                const cutoff = new Date(now.getFullYear(), now.getMonth() - 2, 1);
                const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth() + 1).padStart(2, '0')}-01`;
                filteredDb = sourceList.filter(i => i.date && i.date >= cutoffStr);
                filenameSuffix = "recent_3months";
            } else if (rangeType === 'month') {
                const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                filteredDb = sourceList.filter(i => i.date && i.date.startsWith(thisMonth));
                filenameSuffix = thisMonth;
            }

            let blob, filename, mimeType;

            if (fmt === 'json') {
                const payload = {
                    exportedAt: new Date().toISOString(),
                    range: rangeType,
                    cats: cats,
                    db: filteredDb
                };
                mimeType = 'application/json';
                blob = new Blob([JSON.stringify(payload, null, 2)], { type: mimeType });
                filename = `GemMoney_${filenameSuffix}.json`;
            } else {
                let csv = "\uFEFF日付,カテゴリ,項目,金額,メモ\n" + filteredDb.map(r => `${r.date},"${(r.category||'').replace(/"/g,'""')}","${(r.title||'').replace(/"/g,'""')}",${r.amount},"${(r.memo||'').replace(/"/g,'""')}"`).join("\n");
                mimeType = 'text/csv;charset=utf-8;';
                blob = new Blob([csv], { type: mimeType });
                filename = `GemMoney_${filenameSuffix}.csv`;
            }

            document.getElementById('modal').style.display = 'none';

            // Web Share API によるワンタップ共有
            if (action === 'share') {
                const file = new File([blob], filename, { type: mimeType });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'GemMoney データ共有',
                            files: [file]
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return; // ユーザーキャンセル時は何もしない
                    }
                } else if (navigator.share) {
                    try {
                        const fileFallback = new File([blob], filename, { type: 'text/plain' });
                        if (navigator.canShare && navigator.canShare({ files: [fileFallback] })) {
                            await navigator.share({
                                title: 'GemMoney データ共有',
                                files: [fileFallback]
                            });
                            return;
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }
                // Web Share 非対応ブラウザの場合は通常のファイル保存へフォールバック
            }

            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                try {
                    const d = JSON.parse(ev.target.result);
                    if (d.db && Array.isArray(d.db)) {
                        pendingImportData = d;
                        openImportModal(d.db.filter(i => !i.deleted).length);
                    } else {
                        alert("対応するデータ形式ではありません。");
                    }
                } catch (err) {
                    alert("JSONファイルの読み込みに失敗しました。");
                }
                e.target.value = '';
            };
            r.readAsText(file);
        }

        function openImportModal(count) {
            const m = document.getElementById('modal');
            const b = document.getElementById('m-body');
            document.getElementById('m-title').innerText = `JSON読込 (有効データ ${count}件)`;
            b.style.gridTemplateColumns = '1fr';
            b.innerHTML = `
                <button class="card" onclick="executeImport('merge')" style="padding:14px; text-align:left; border-color:var(--blue);">
                    <div style="color:var(--blue); font-size:15px; margin-bottom:4px;">🔄 既存データと統合（マージ）</div>
                    <div style="font-size:11px; color:#aaa; font-weight:normal;">追加・編集・削除（論理削除）を判定して最新の状態に統合します（推奨）</div>
                </button>
                <button class="card" onclick="executeImport('overwrite')" style="padding:14px; text-align:left;">
                    <div style="color:var(--red); font-size:15px; margin-bottom:4px;">⚠️ 完全に上書き（置換）</div>
                    <div style="font-size:11px; color:#aaa; font-weight:normal;">現在のスマホ内のデータをすべて消去し、ファイルの内容に置き換えます</div>
                </button>
            `;
            m.style.display = 'flex';
        }

        function executeImport(type) {
            if (!pendingImportData) return;
            const d = pendingImportData;
            pendingImportData = null;
            document.getElementById('modal').style.display = 'none';

            if (type === 'overwrite') {
                if (!confirm("本当に現在のデータをすべて消去して上書きしますか？")) return;
                db = d.db;
                if (d.cats && Array.isArray(d.cats)) {
                    cats = [...new Set([...d.cats, '収入'])];
                }
                db.sort((a, b) => new Date(b.date) - new Date(a.date));
                save();
                renderCats();
                render();
                alert(`${getActiveDb().length}件のデータを上書きしました。`);
            } else {
                const existingMap = new Map(db.map(i => [i.id, i]));
                let added = 0, updated = 0, deletedSync = 0;

                d.db.forEach(item => {
                    if (existingMap.has(item.id)) {
                        const existing = existingMap.get(item.id);
                        const inTime = item.updatedAt || 0;
                        const exTime = existing.updatedAt || 0;

                        // 削除フラグの同期と更新日時の比較
                        if (item.deleted && !existing.deleted) {
                            if (inTime >= exTime || exTime === 0) {
                                existing.deleted = true;
                                existing.updatedAt = Math.max(inTime, exTime, Date.now());
                                deletedSync++;
                            }
                        } else if (!item.deleted && existing.deleted) {
                            if (inTime > exTime) {
                                Object.assign(existing, item);
                                delete existing.deleted;
                                updated++;
                            }
                        } else if (!item.deleted && !existing.deleted) {
                            if (inTime >= exTime) {
                                Object.assign(existing, item);
                                updated++;
                            }
                        }
                    } else {
                        db.push(item);
                        existingMap.set(item.id, item);
                        if (!item.deleted) added++;
                    }
                });

                if (d.cats && Array.isArray(d.cats)) {
                    cats = [...new Set([...cats, ...d.cats, '収入'])];
                }
                db.sort((a, b) => new Date(b.date) - new Date(a.date));
                save();
                renderCats();
                render();
                alert(`統合完了：新規 ${added}件 追加 / ${updated}件 更新 / ${deletedSync}件 削除反映`);
            }
        }

        function manageCats() {
            const n = prompt("カテゴリ(,区切り)", cats.join(","));
            if(n) {
                cats = n.split(",").map(s=>s.trim()).filter(s=>s);
                if (!cats.includes("収入")) cats.push("収入");
                save(); renderCats(); render();
            }
        }
        init();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker登録成功:', registration.scope);
                }, function(err) {
                    console.log('ServiceWorker登録失敗:', err);
                });
            });
        }
    </script>
